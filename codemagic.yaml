workflows:
  build-streamcar-ipa:
    name: Build StreamCar iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build Unsigned IPA Archive using xcodebuild
        script: |
          mkdir -p build/Payload
          
          # Compile native Swift project using xcodebuild
          xcodebuild -project StreamCar/StreamCar.xcodeproj \
                     -scheme StreamCar \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build/DerivedData \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

          # Copy .app bundle into Payload folder and zip to StreamCar.ipa
          cp -r build/DerivedData/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r StreamCar.ipa Payload
    artifacts:
      - build/*.ipa
